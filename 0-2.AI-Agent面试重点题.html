<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="基于面试题截图整理的 AI Agent 开发岗位重点题单，按重点、算法、原理与拔高分类。">
  <meta name="theme-color" content="#f4f1e8">
  <title>AI Agent 面试重点题</title>
  <style>
    :root {
      color-scheme: light;
      --page:#f4f1e8; --paper:#fffdf8; --ink:#18202d; --muted:#697283;
      --line:#dedad0; --line-soft:#ece8de; --blue:#3776ab; --blue-deep:#24577f;
      --blue-soft:#e8f2fa; --yellow:#efbd16; --yellow-soft:#fff4c4; --yellow-deep:#735a00;
      --mint:#287f6b; --mint-soft:#e7f4ef; --purple:#7d5db0; --purple-soft:#f0ebf8;
      --coral:#df684d; --coral-soft:#ffefe9; --shadow:0 22px 58px rgba(47,43,33,.09);
      --sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    }
    [data-theme="dark"] {
      color-scheme:dark; --page:#121720; --paper:#1a222d; --ink:#eef3f8; --muted:#a7b2c1;
      --line:#354251; --line-soft:#2b3644; --blue-deep:#82c0ef; --blue-soft:#172e43;
      --yellow-soft:#3c3518; --yellow-deep:#f4d55a; --mint-soft:#17362f;
      --purple-soft:#302740; --coral-soft:#3d2521; --shadow:0 24px 65px rgba(0,0,0,.27);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink);background:radial-gradient(circle at 9% 2%,color-mix(in srgb,var(--blue) 14%,transparent),transparent 31rem),radial-gradient(circle at 92% 8%,color-mix(in srgb,var(--yellow) 18%,transparent),transparent 28rem),var(--page);font-family:var(--sans);line-height:1.65;-webkit-font-smoothing:antialiased}
    button{color:inherit;font:inherit;cursor:pointer}
    .progress-track{position:fixed;inset:0 0 auto;z-index:120;height:4px}.progress-bar{width:0;height:100%;background:linear-gradient(90deg,var(--blue),var(--purple),var(--yellow))}
    .topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;min-height:66px;padding:0 clamp(16px,4vw,56px);border-bottom:1px solid color-mix(in srgb,var(--line) 80%,transparent);background:color-mix(in srgb,var(--page) 86%,transparent);backdrop-filter:blur(5px)}
    .brand{display:flex;align-items:center;gap:11px;font-weight:850}.brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple));font:850 11px/1 var(--mono)}
    .icon-button{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
    .hero{max-width:1120px;margin:auto;padding:clamp(54px,8vw,92px) 22px 30px}.eyebrow{color:var(--blue-deep);font:850 12px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase}.eyebrow:before{content:"";display:inline-block;width:28px;height:3px;margin:0 9px 3px 0;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--yellow))}
    h1{max-width:900px;margin:18px 0 0;font-size:clamp(41px,7vw,75px);line-height:1.04;letter-spacing:-.055em}h1 span{color:var(--blue)}
    .hero-copy{max-width:760px;margin:22px 0 0;color:var(--muted);font-size:clamp(16px,2vw,19px)}
    .summary{display:flex;flex-wrap:wrap;gap:9px;margin-top:28px}.summary span{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--paper) 88%,transparent);font-size:12px;font-weight:750}.summary b{color:var(--blue-deep);font-family:var(--mono)}
    .content-layout{display:grid;grid-template-columns:252px minmax(0,1fr);align-items:start;gap:24px;max-width:1450px;margin:auto;padding:0 22px 90px}
    .main{min-width:0}
    .question-nav{position:sticky;top:78px;max-height:calc(100vh - 96px)}
    .question-nav-panel{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--paper) 92%,transparent);box-shadow:0 12px 36px rgba(45,40,28,.07);backdrop-filter:blur(16px)}
    .question-nav-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 12px;border-bottom:1px solid var(--line-soft)}.question-nav-title{font-size:13px;font-weight:900}.question-nav-count{display:block;margin-top:2px;color:var(--muted);font:700 10px/1.3 var(--mono)}
    .nav-top-button{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:14px}.nav-top-button:hover{color:var(--blue-deep);border-color:var(--blue);background:var(--blue-soft)}
    .question-nav-list{display:grid;gap:3px;max-height:calc(100vh - 168px);padding:8px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
    .question-nav-link{display:grid;grid-template-columns:38px minmax(0,1fr);align-items:start;gap:7px;width:100%;padding:8px;border:0;border-radius:10px;background:transparent;text-align:left}.question-nav-link:hover{background:var(--blue-soft)}.question-nav-link.active{color:var(--blue-deep);background:var(--blue-soft);box-shadow:inset 3px 0 var(--blue)}
    .question-nav-number{padding-top:2px;color:var(--muted);font:800 10px/1.4 var(--mono)}.question-nav-link.active .question-nav-number{color:var(--blue-deep)}.question-nav-text{overflow:hidden;font-size:11px;font-weight:750;line-height:1.45;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
    .tabs-shell{position:sticky;top:78px;z-index:70;padding:8px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--paper) 90%,transparent);box-shadow:0 12px 36px rgba(45,40,28,.07);backdrop-filter:blur(16px)}
    .tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.tab{min-height:48px;padding:9px 12px;border:0;border-radius:12px;background:transparent;font-size:13px;font-weight:800}.tab:hover{background:var(--blue-soft)}.tab.active{color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 8px 20px rgba(55,118,171,.22)}.tab small{display:block;margin-top:2px;font:700 10px/1 var(--mono);opacity:.75}
    .section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin:32px 2px 15px}.section-head h2{margin:0;font-size:27px;letter-spacing:-.035em}.section-head p{max-width:600px;margin:0;color:var(--muted);font-size:13px;text-align:right}
    .question-list{display:grid;gap:14px}.card{overflow:hidden;scroll-margin-top:148px;border:1px solid var(--line);border-radius:20px;background:var(--paper);box-shadow:0 10px 28px rgba(45,40,28,.055)}
    .card-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:15px;padding:20px 21px;border-bottom:1px solid var(--line-soft)}.number{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;color:var(--blue-deep);background:var(--blue-soft);font:900 13px/1 var(--mono)}
    .card[data-category="算法"] .number{color:var(--coral);background:var(--coral-soft)}.card[data-category="原理"] .number{color:var(--mint);background:var(--mint-soft)}.card[data-category="拔高"] .number{color:var(--purple);background:var(--purple-soft)}
    .card h3{margin:0;font-size:18px;line-height:1.42;letter-spacing:-.018em}.requirement{margin:7px 0 0;color:var(--blue-deep);font-size:13px;font-weight:800}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.tag{padding:4px 8px;border-radius:999px;color:var(--muted);background:var(--line-soft);font-size:10px;font-weight:800}.tag.company{color:var(--blue-deep);border:1px solid color-mix(in srgb,var(--blue) 27%,transparent);background:var(--blue-soft)}.tag.focus{color:var(--yellow-deep);background:var(--yellow-soft)}
    .original-question{margin-top:13px;border:1px solid var(--line);border-radius:13px;background:color-mix(in srgb,var(--paper) 78%,var(--blue-soft))}.original-question summary{display:flex;align-items:center;gap:9px;padding:10px 12px;color:var(--blue-deep);font-size:12px;font-weight:850;list-style:none;cursor:pointer;user-select:none}.original-question summary::-webkit-details-marker{display:none}.original-question summary:before{content:"+";display:grid;place-items:center;width:20px;height:20px;border-radius:7px;color:#fff;background:var(--blue);font:900 14px/1 var(--mono)}.original-question[open] summary:before{content:"−"}.original-question[open] summary{border-bottom:1px solid var(--line)}.original-copy{margin:0;padding:13px 14px 15px;color:var(--ink);font-size:13px;line-height:1.8;white-space:pre-line}
    .mastery{padding:18px 21px 21px}.mastery-label{display:flex;align-items:center;gap:9px;color:var(--muted);font:850 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}.mastery-label:after{content:"";height:1px;flex:1;background:var(--line-soft)}.mastery ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 26px;margin:14px 0 0;padding:0;list-style:none}.mastery li{position:relative;padding-left:19px;font-size:14px}.mastery li:before{content:"✓";position:absolute;left:0;top:0;color:var(--mint);font-weight:900}
    .empty{display:none;padding:65px 20px;border:1px dashed var(--line);border-radius:20px;color:var(--muted);background:var(--paper);text-align:center}
    .footer{max-width:900px;margin:auto;padding:0 22px 70px;color:var(--muted);text-align:center;font-size:12px}.footer:before{content:"";display:block;width:62px;height:3px;margin:0 auto 20px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--yellow))}
    @media(max-width:1180px){.content-layout{display:block;max-width:1120px}.question-nav{display:none}}
    @media(max-width:760px){.tabs-shell{top:73px;overflow-x:auto}.tabs{display:flex;min-width:max-content}.tab{min-width:116px}.section-head{display:block}.section-head p{margin-top:8px;text-align:left}.mastery ul{grid-template-columns:1fr}}
    @media(max-width:520px){.hero,.content-layout{padding-left:14px;padding-right:14px}.brand-text{display:none}.card-head{padding:17px}.mastery{padding:16px 17px 19px}.number{width:43px;height:43px}}
    @media print{.topbar,.progress-track,.tabs-shell,.question-nav{display:none}.hero{padding-top:20px}.content-layout{display:block;padding-bottom:20px}.card{break-inside:avoid;box-shadow:none}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">AG</span><span class="brand-text">AI Agent 面试重点题</span></div>
    <button class="icon-button" id="themeButton" type="button" aria-label="切换深浅色模式" title="切换深浅色模式">◐</button>
  </header>

  <header class="hero">
    <div class="eyebrow">AI Agent Interview Focus</div>
    <h1>AI Agent 开发面试<br><span>重点题清单</span></h1>
    <p class="hero-copy">面向 AI Agent 开发岗位筛选与分类：重点题需要深入掌握，算法题用于通用编程轮，原理题掌握核心机制，拔高题按页面标注理解即可。题号按当前复习顺序编排。</p>
    <div class="summary"><span><b data-summary-category="重点">108</b> 道重点</span><span><b data-summary-category="算法">21</b> 道算法</span><span><b data-summary-category="原理">21</b> 道原理</span><span><b data-summary-category="拔高">20</b> 道拔高</span></div>
  </header>

  <div class="content-layout">
    <aside class="question-nav" aria-label="题目快速导航">
      <div class="question-nav-panel">
        <div class="question-nav-head">
          <div><div class="question-nav-title">题目导航</div><small class="question-nav-count" id="questionNavCount">170 道</small></div>
          <button class="nav-top-button" id="navTopButton" type="button" aria-label="回到题目分类顶部" title="回到题目分类顶部">↑</button>
        </div>
        <nav class="question-nav-list" id="questionNavList" aria-label="当前分类题目"></nav>
      </div>
    </aside>

    <main class="main">
    <nav class="tabs-shell" aria-label="题目分类">
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab active" role="tab" aria-selected="true" data-category="全部" type="button">全部<small>170 题</small></button>
        <button class="tab" role="tab" aria-selected="false" data-category="重点" type="button">重点准备<small>108 题</small></button>
        <button class="tab" role="tab" aria-selected="false" data-category="算法" type="button">算法<small>21 题</small></button>
        <button class="tab" role="tab" aria-selected="false" data-category="原理" type="button">原理<small>21 题</small></button>
        <button class="tab" role="tab" aria-selected="false" data-category="拔高" type="button">拔高<small>20 题</small></button>
      </div>
    </nav>

    <div class="section-head">
      <h2 id="sectionTitle">全部题目</h2>
      <p id="sectionDescription">先学“重点准备”，算法题用于通用编程轮，拔高题只需达到页面标注的理解深度。</p>
    </div>
    <section class="question-list" id="questionList" aria-live="polite"></section>
    <div class="empty" id="emptyState">当前分类没有题目。</div>
    </main>
  </div>

  <footer class="footer">AI Agent 面试重点题 · 按岗位相关性安排掌握深度</footer>

  <script>
    const questions = [
      {
        id:1, category:"重点", company:"蚂蚁国际", title:"RAG 系统如何设计文本分块策略？",
        requirement:"需要重点掌握，能结合 Agent / RAG 项目回答。",
        original:`在 RAG 系统中，为同时保障语义完整性与支持人工标注关键分块边界，应如何设计兼顾自动化鲁棒性与人类先验可注入性的文本分块策略？请阐述其核心权衡考量（如粒度-连贯性-标注成本的三角约束）、典型技术实现路径（如语义感知切分、边界强化学习、混合规则+LLM 校验），以及该策略对检索精度与系统可维护性的影响。`,
        points:["固定长度、递归分块、语义分块和混合分块的适用场景","chunk size 和 overlap 对语义完整性、噪声和召回的影响","metadata、标题、页码、来源与父子块如何保留","用真实问题集评估召回命中、答案证据和系统可维护性"]
      },
      {
        id:2, category:"重点", company:"滴滴", title:"为什么缩放点积注意力要除以 √dₖ？",
        requirement:"需要掌握推导链路，不要只背“防止梯度消失”。",
        original:`为什么在缩放点积注意力（scaled dot-product attention）中需将 QKᵀ 除以 √dₖ？请分别从 logits 的方差增长（概率分布视角）和梯度幅值稳定性（优化视角）两个角度解释其必要性。`,
        points:["Q·K 是 dₖ 个乘积之和，其方差随 dₖ 增长、标准差约为 √dₖ","logits 过大会让 softmax 过早饱和、分布过尖","softmax 饱和后 Jacobian 趋近 0，Q/K 投影层获得的梯度变小","dₖ 是每个 head 的 query/key 维度，不是总 d_model"]
      },
      {
        id:3, category:"重点", company:"阿里巴巴", title:"Transformer 中 Pre-Norm 与 Post-Norm 有什么区别？",
        requirement:"需要会画结构，并能说清梯度流和训练稳定性。",
        original:`Transformer 中 Pre-norm 与 Post-norm 结构在梯度流动、训练稳定性及收敛行为上有何关键差异？这些差异如何从优化动态（如梯度方差、残差路径梯度值、归一化层输入分布变化）角度解释 LLaMA 等主流大模型选择 Pre-norm 的架构设计依据？`,
        points:["Post-Norm：Norm(x + F(x))；Pre-Norm：x + F(Norm(x))","Pre-Norm 中残差主干提供更直接的梯度通道","Pre-Norm 通常更易稳定训练深层模型，但不代表所有场景都更好","知道现代 LLM 中常见 RMSNorm，并能与 LayerNorm 区分"]
      },
      {
        id:4, category:"重点", company:"蚂蚁集团", title:"在 SFT 数据构造中，如何系统设计高质量指令—响应对？",
        requirement:"需要会结构化分析，不必深入训练代码。",
        original:`在监督微调（SFT）数据构造过程中，如何系统性设计高质量的“指令-响应对”？需重点分析覆盖性（任务/领域/语言分布）、难度梯度（从基础到复杂的能力分层）、标注/偏好一致性（含人工标注规范与多标注者协同机制）等关键因素，并说明各因素间的潜在权衡关系。`,
        points:["任务和场景覆盖，包括基础到复杂的难度梯度","instruction、context 与 response 的一致性和可执行性","AI 标注、多标注者协同与人工抽检验收","Agent 工具调用数据中的工具选择、参数、结果和最终回答要一致"]
      },
      {
        id:5, category:"算法", company:"微信 WXG、美团", title:"手写快速排序的 partition 函数并分析复杂度。",
        requirement:"算法轮需要能完整手写和讲解。",
        original:`请手写快速排序的递归实现，要求完整包含 partition 函数（明确指定主元选择策略、分区逻辑及边界处理），并准确分析其平均时间复杂度的推导依据，以及最坏时间复杂度的触发条件（需说明输入特征与递归树形态的关系）。`,
        points:["熟练 Lomuto 或 Hoare 至少一种 partition 写法","partition 的循环不变量、左右区间代表什么","平均 O(n log n)、最坏 O(n²)，原地额外空间与递归栈要分开说","有序、重复元素和极端 pivot 下的退化与改进"]
      },
      {
        id:6, category:"算法", company:"字节跳动、快手、百度", title:"求时间 O(n)、空间 O(1) 的最大子数组和。",
        requirement:"算法轮需要能无提示写出 Kadane 算法。",
        original:`实现时间复杂度 O(n)、空间复杂度 O(1) 的最大子数组和算法，并说明其正确性依据。`,
        points:["current 表示以当前位置结尾的最大和，best 是全局最大和","current = max(x, current + x)，best = max(best, current)","初始值应来自第一个元素，才能处理全负数数组","能解释负贡献的前缀为什么可以丢弃"]
      },
      {
        id:7, category:"算法", company:"蚂蚁集团", title:"队列和栈的核心抽象差异是什么？",
        requirement:"通用编程基础：需要掌握 ADT 接口契约、基础实现和典型应用。",
        original:`队列和栈的核心抽象差异是什么？请各举一个不可互相替代的典型算法或系统场景，并从 ADT 本质、操作约束与实际系统需求的映射角度，说明为何在此场景中二者无法通过简单封装或逆序调整相互替代。`,
        points:["栈是 LIFO：在同一端 push / pop；队列是 FIFO：一端 enqueue、另一端 dequeue","栈常用于函数调用、DFS、括号匹配和撤销；队列常用于 BFS、任务调度和消息缓冲","ADT 定义行为契约，底层容器相同不代表二者可互换","Python 中队列优先使用 collections.deque，避免 list.pop(0) 的 O(n) 搬移"]
      },
      {
        id:8, category:"算法", company:"阿里巴巴", title:"用动态规划解决分割等和子集。",
        requirement:"算法轮需要能写出一维 0/1 背包解法，并解释为何倒序。",
        original:`如何用动态规划解决“分割等和子集”问题？请明确定义状态、推导状态转移方程、说明边界条件与初始化逻辑，并深入分析从二维 DP 到一维 DP 空间优化的关键前提、实现细节及易错点（如遍历顺序为何必须逆序）。`,
        points:["总和为奇数直接返回 false，目标是寻找和为 total/2 的子集","dp[j] 表示当前元素范围内是否能组成和 j，dp[0]=true","dp[j] = dp[j] || dp[j-num]，每个元素只能使用一次","容量 j 必须倒序遍历，否则会在同一轮重复使用当前元素，变成完全背包"]
      },
      {
        id:9, category:"原理", company:"字节跳动（抖音）", title:"写出 Sigmoid 函数及其一阶导数的闭式表达式。",
        requirement:"基础原理题：会写结论并能用链式法则简短推导。",

        points:["显式请求—响应简单直观、低延迟，适合同步强依赖步骤，但调用链耦合高且容易级联超时","消息队列/事件总线解耦生产消费并支持削峰重试，适合异步任务；需处理重复、乱序、积压和最终一致性","共享内存或黑板便于多个 Agent 围绕共同状态协作，适合探索/汇聚，但必须定义所有权、版本、锁/CAS 和冲突规则","选型依据任务依赖、延迟、吞吐和一致性；统一消息 schema、幂等键、权限、trace 和失败恢复，常采用混合架构"]
      },
      {
        id:167, category:"算法", company:"蚂蚁", title:"AVL 平衡二叉树的旋转与高度证明。",
        requirement:"数据结构基础题：掌握平衡因子、四类失衡旋转，以及为什么树高保持 O(log n)。",
        original:`平衡二叉树（如AVL树）的核心定义和自平衡机制是什么？如何证明其高度为O(log n)？`,
        points:["AVL 是二叉搜索树，任一节点左右子树高度差的绝对值不超过 1，节点通常维护 height 或 balance factor","插入/删除后自底向上更新高度；LL/RR 分别单旋，LR/RL 先对子树旋转再对失衡节点旋转","高度为 h 的 AVL 最少节点满足 N(h)=N(h-1)+N(h-2)+1，按斐波那契速度增长，因此 h=O(log n)","查找、插入、删除均保持 O(log n)；旋转必须同时维护 BST 顺序、父子链接和高度，删除可能连续向上再平衡"]
      },
      {
        id:168, category:"拔高", company:"字节", title:"Agent 如何在快思考与慢思考之间动态路由？",
        requirement:"理解路由思想和工程实现即可：重点是难度判断、升级条件和质量—延迟权衡，不要求训练路由头。",
        original:`Qwen3提出的“快思考”与“慢思考”机制，本质上对应哪些推理路径分离设计？其在模型结构或推理流程中可能的实现范式（如early-exit、cascade decoding、or verification head）有哪些？`,
        points:["快路径用于抽取、改写、简单问答和确定性工具路由；慢路径给复杂规划、多约束推理和高风险决策更多计算预算","可在应用层用任务分类/不确定性路由小模型→验证器→大模型，也可通过 early-exit、级联解码或验证头决定是否继续计算","升级信号包括验证失败、低置信、证据冲突、工具错误和任务复杂度；阈值需在真实任务集上按风险和成本校准","Agent 开发重点是可观测路由、最大预算、降级与回退，并联合评估任务成功率、TTFT、总延迟、token 和调用成本"]
      },
      {
        id:169, category:"重点", company:"小红书", title:"UGC 知识库如何识别并过滤低质量内容？",
        requirement:"RAG 数据治理重点：需要说明入库过滤、质量评分、检索约束和持续反馈闭环。",
        original:`面向RAG知识库构建，如何对低质量、高噪声的UGC文本（如含事实错误、主观臆断的内容）进行自动化可信度识别与过滤？`,
        points:["入库前结合规则、重复/广告检测、内容安全分类器、事实核验和 LLM Judge 识别垃圾、冲突、过时与恶意内容","可信度不只看文本：结合来源、作者历史、时间、引用证据、用户反馈和跨来源一致性，输出可解释的质量分与风险标签","高风险内容隔离或待审，普通内容把质量、时效和权限写入 metadata，在检索过滤和 rerank 中降权而非一刀切删除","建立人工抽检、申诉与线上 bad case 回流，监控误杀/漏放、分布漂移和检索后答案忠实度，并保留来源与处置审计"]
      },
      {
        id:170, category:"重点", company:"腾讯", title:"大模型服务上线后应该监控哪些指标？",
        requirement:"生产可观测性必会：要把输入、输出质量、系统性能、成本和版本关联到同一条 trace。",
        original:`大模型AI服务上线后，应监控哪些关键维度（如输入分布漂移、输出质量退化、延迟异常、token消耗突增）及对应的可观测性手段？`,
        points:["输入侧监控语言/场景、长度、意图、敏感内容与 Prompt injection 命中，比较线上分布和评测基线发现漂移","质量侧跟踪任务成功率、正确性/忠实性、安全、拒答、JSON/工具调用合规率，并通过抽样人工与回归集校准 Judge","系统侧监控 TTFT、TPOT、P50/P95/P99、吞吐、队列、错误/超时/取消率及 GPU、KV Cache 和下游工具状态","成本侧看输入/输出 token、缓存命中、重试与工具调用次数；按模型、Prompt、知识库、工具和发布版本切分 trace，设置告警与自动回滚"]
      }
    ];

    const descriptions = {
      "全部":"先学“重点准备”，算法题用于通用编程轮，拔高题只需达到页面标注的理解深度。",
      "重点":"与 AI Agent / LLM 应用开发相关性最高，需要能给出结论、原理和工程取舍。",
      "算法":"不是 Agent 专业知识，但可能出现在通用编程轮；按每题的标注准备。",
      "原理":"通用机器学习基础，会写核心公式并能做简短推导。",
      "拔高":"只需理解动机、核心机制和对 Agent 工程的影响，不要在手写和训练细节上过度投入。"
    };

    const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const list = document.getElementById("questionList");
    const title = document.getElementById("sectionTitle");
    const description = document.getElementById("sectionDescription");
    const empty = document.getElementById("emptyState");
    const questionNavList = document.getElementById("questionNavList");
    const questionNavCount = document.getElementById("questionNavCount");
    const navTopButton = document.getElementById("navTopButton");
    let activeQuestionId = null;

    function syncCounts() {
      const counts = questions.reduce((result, question) => {
        result[question.category] = (result[question.category] || 0) + 1;
        return result;
      }, {});
      document.querySelectorAll("[data-summary-category]").forEach(element => {
        element.textContent = counts[element.dataset.summaryCategory] || 0;
      });
      document.querySelectorAll("#tabs [data-category]").forEach(tab => {
        const category = tab.dataset.category;
        const count = category === "全部" ? questions.length : (counts[category] || 0);
        tab.querySelector("small").textContent = `${count} 题`;
      });
    }

    function renderQuestionNav(selected) {
      questionNavCount.textContent = `${selected.length} 道`;
      questionNavList.innerHTML = selected.map(question => `
        <button class="question-nav-link" type="button" data-question-id="${question.id}" title="${escapeHTML(question.title)}">
          <span class="question-nav-number">#${question.id}</span>
          <span class="question-nav-text">${escapeHTML(question.title)}</span>
        </button>
      `).join("");
      activeQuestionId = null;
    }

    function setActiveQuestion(questionId) {
      if (!questionId || activeQuestionId === questionId) return;
      activeQuestionId = questionId;
      questionNavList.querySelectorAll(".question-nav-link").forEach(link => {
        link.classList.toggle("active", Number(link.dataset.questionId) === questionId);
      });
      const activeLink = questionNavList.querySelector(`.question-nav-link[data-question-id="${questionId}"]`);
      if (activeLink) activeLink.scrollIntoView({block:"nearest"});
    }

    function updateActiveQuestion() {
      const cards = [...list.querySelectorAll(".card")];
      if (!cards.length) return;
      let active = cards[0];
      for (const card of cards) {
        if (card.getBoundingClientRect().top <= 165) active = card;
        else break;
      }
      setActiveQuestion(Number(active.dataset.questionId));
    }

    function render(category) {
      const selected = category === "全部" ? questions : questions.filter(question => question.category === category);
      title.textContent = category === "全部" ? "全部题目" : `${category}题目`;
      description.textContent = descriptions[category];
      empty.style.display = selected.length ? "none" : "block";
      list.innerHTML = selected.map(question => `
        <article class="card" id="question-${question.id}" data-question-id="${question.id}" data-category="${escapeHTML(question.category)}">
          <header class="card-head">
            <span class="number">#${question.id}</span>
            <div>
              <h3>${escapeHTML(question.title)}</h3>
              <p class="requirement">${escapeHTML(question.requirement)}</p>
              <div class="meta">
                <span class="tag focus">${escapeHTML(question.category)}</span>
                <span class="tag company">${escapeHTML(question.company)}</span>
              </div>
              <details class="original-question">
                <summary>查看题库原题</summary>
                <p class="original-copy">${escapeHTML(question.original)}</p>
              </details>
            </div>
          </header>
          <div class="mastery">
            <div class="mastery-label">你需要掌握</div>
            <ul>${question.points.map(point => `<li>${escapeHTML(point)}</li>`).join("")}</ul>
          </div>
        </article>
      `).join("");
      renderQuestionNav(selected);
      requestAnimationFrame(updateActiveQuestion);
    }

    const tabs = document.getElementById("tabs");
    tabs.addEventListener("click", event => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      tabs.querySelectorAll(".tab").forEach(tab => {
        const active = tab === button;
        tab.classList.toggle("active", active);
        tab.setAttribute("aria-selected", String(active));
      });
      render(button.dataset.category);
    });
    tabs.addEventListener("keydown", event => {
      if (!['ArrowLeft','ArrowRight'].includes(event.key)) return;
      const allTabs = [...tabs.querySelectorAll('.tab')];
      const current = allTabs.indexOf(document.activeElement);
      if (current < 0) return;
      event.preventDefault();
      const next = event.key === 'ArrowRight' ? (current + 1) % allTabs.length : (current - 1 + allTabs.length) % allTabs.length;
      allTabs[next].focus();
      allTabs[next].click();
    });

    questionNavList.addEventListener("click", event => {
      const button = event.target.closest("[data-question-id]");
      if (!button) return;
      const questionId = Number(button.dataset.questionId);
      const card = document.getElementById(`question-${questionId}`);
      if (!card) return;
      setActiveQuestion(questionId);
      card.scrollIntoView({behavior:"smooth", block:"start"});
      try { history.replaceState(null, "", `#question-${questionId}`); } catch (_) {}
    });
    navTopButton.addEventListener("click", () => {
      document.querySelector(".tabs-shell").scrollIntoView({behavior:"smooth", block:"start"});
    });

    const root = document.documentElement;
    const themeButton = document.getElementById("themeButton");
    try { const saved = localStorage.getItem("agent-interview-focus-theme"); if (saved) root.dataset.theme = saved; } catch (_) {}
    themeButton.addEventListener("click", () => {
      root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
      try { localStorage.setItem("agent-interview-focus-theme", root.dataset.theme); } catch (_) {}
    });
    const progressBar = document.getElementById("progressBar");
    function updateProgress() {
      const total = document.documentElement.scrollHeight - innerHeight;
      progressBar.style.width = `${total > 0 ? scrollY / total * 100 : 0}%`;
    }
    addEventListener("scroll", () => {
      updateProgress();
      updateActiveQuestion();
    }, {passive:true});
    syncCounts();
    render("全部");
    updateProgress();
  </script>
</body>
</html>
