<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="theme-color" content="#f5f2e9">
  <title>AI 面试真题汇总</title>
  <style>

    *{box-sizing:border-box} html{scroll-behavior:smooth;scroll-padding-top:80px} body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 2%,color-mix(in srgb,var(--blue) 14%,transparent),transparent 30rem),radial-gradient(circle at 94% 10%,color-mix(in srgb,var(--yellow) 18%,transparent),transparent 27rem),var(--page);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased} button,input{color:inherit;font:inherit} button{cursor:pointer} a{color:inherit;text-decoration:none} ::selection{background:color-mix(in srgb,var(--blue) 24%,transparent)}
    .progress-track{position:fixed;inset:0 0 auto;z-index:120;height:4px}.progress-bar{width:0;height:100%;background:linear-gradient(90deg,var(--blue),var(--purple),var(--yellow))}
    .topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;min-height:66px;padding:0 clamp(16px,4vw,58px);border-bottom:1px solid color-mix(in srgb,var(--line) 78%,transparent);background:color-mix(in srgb,var(--page) 86%,transparent);backdrop-filter:blur(5px)}
    .brand{display:flex;align-items:center;gap:11px;font-weight:850}.brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 8px 20px rgba(55,118,171,.22)}
    .top-actions{display:flex;gap:8px}.icon-button{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
    .hero{max-width:1180px;margin:auto;padding:clamp(58px,8vw,100px) 22px 36px}.eyebrow{display:flex;align-items:center;gap:9px;color:var(--blue-deep);font:800 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}.eyebrow:before{content:"";width:28px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--yellow))}
    h1{max-width:930px;margin:18px 0 0;font-size:clamp(42px,7vw,78px);line-height:1.04;letter-spacing:-.055em} h1 span{color:var(--blue)}.hero-copy{max-width:760px;margin:23px 0 0;color:var(--muted);font-size:clamp(16px,2vw,20px)}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:880px;margin-top:30px}.stat{padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--paper) 90%,transparent)}.stat b{display:block;font:850 26px/1.1 var(--mono);color:var(--blue-deep)}.stat span{color:var(--muted);font-size:12px}.stat:nth-child(2) b{color:var(--purple)}.stat:nth-child(3) b{color:var(--mint)}.stat:nth-child(4) b{color:var(--yellow-deep)}
    .main{max-width:1180px;margin:auto;padding:0 22px 90px}.workspace{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}.sidebar{position:sticky;top:86px;padding:18px;border:1px solid var(--line);border-radius:20px;background:var(--paper);box-shadow:var(--shadow)}
    .sidebar-title{margin:0 0 13px;font-size:13px;font-weight:850}.topic-list{display:grid;gap:7px}.topic-button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 12px;border:1px solid transparent;border-radius:12px;background:transparent;text-align:left}.topic-button:hover{background:var(--blue-soft)}.topic-button.active{color:var(--blue-deep);border-color:color-mix(in srgb,var(--blue) 28%,var(--line));background:var(--blue-soft);font-weight:800}.topic-button small{min-width:25px;padding:2px 7px;border-radius:999px;background:var(--paper-strong);text-align:center}.sidebar-note{margin-top:17px;padding:13px;border-radius:12px;color:var(--muted);background:var(--yellow-soft);font-size:12px}.sidebar-note b{color:var(--yellow-deep)}
    .content{min-width:0}.toolbar{position:sticky;top:78px;z-index:80;padding:12px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(16px);box-shadow:0 12px 36px rgba(45,40,28,.07)}.search-row{display:flex;gap:9px}.search-wrap{position:relative;flex:1}.search-wrap span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}.search{width:100%;height:46px;padding:0 15px 0 42px;border:1px solid var(--line);border-radius:13px;outline:none;background:var(--paper-strong)}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 15%,transparent)}
    .random-button{padding:0 16px;border:0;border-radius:13px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple));font-weight:800;white-space:nowrap}.filters{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.filter{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:12px;font-weight:750}.filter.active{color:var(--blue-deep);border-color:color-mix(in srgb,var(--blue) 35%,var(--line));background:var(--blue-soft)}
    .result-head{display:flex;align-items:end;justify-content:space-between;margin:30px 2px 14px}.result-head h2{margin:0;font-size:25px;letter-spacing:-.03em}.result-head p{margin:0;color:var(--muted);font-size:12px}.question-list{display:grid;gap:13px}.question-card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 10px 28px rgba(45,40,28,.055);transition:.18s ease}.question-card:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--blue) 28%,var(--line))}.question-card.mastered{border-color:color-mix(in srgb,var(--mint) 45%,var(--line))}.question-main{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;width:100%;padding:19px;border:0;background:transparent;text-align:left}.number{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--blue-deep);background:var(--blue-soft);font:800 12px/1 var(--mono)}.question-card[data-topic="Transformer"] .number{color:var(--purple);background:var(--purple-soft)}.question-card[data-topic="RAG"] .number{color:var(--mint);background:var(--mint-soft)}.question-card[data-topic="Agent"] .number{color:var(--coral);background:var(--coral-soft)}.question-card[data-topic="工程化"] .number{color:var(--yellow-deep);background:var(--yellow-soft)}
    .question-title{margin:1px 0 8px;font-size:17px;line-height:1.48}.meta{display:flex;flex-wrap:wrap;gap:7px}.tag{padding:3px 8px;border-radius:999px;color:var(--muted);background:var(--line-soft);font-size:10px;font-weight:750}.tag.real{color:var(--coral);border:1px solid color-mix(in srgb,var(--coral) 30%,transparent);background:var(--coral-soft);font-weight:850;letter-spacing:.06em}.tag.company{color:var(--blue-deep);border:1px solid color-mix(in srgb,var(--blue) 28%,transparent);background:var(--blue-soft);font-weight:800}.tag.difficulty-困难{color:var(--coral);background:var(--coral-soft)}.tag.difficulty-进阶{color:var(--purple);background:var(--purple-soft)}.chevron{margin-top:10px;color:var(--muted);transition:.18s}.question-card.open .chevron{transform:rotate(180deg)}
    .answer{display:none;padding:0 19px 19px 73px}.question-card.open .answer{display:block}.answer-inner{padding:17px 18px;border:1px solid var(--line-soft);border-radius:14px;background:var(--paper-strong)}.answer-label{color:var(--blue-deep);font:850 11px/1 var(--mono);letter-spacing:.08em}.answer p{margin:9px 0 0;font-size:14px}.keypoints{margin:11px 0 0;padding-left:20px;font-size:14px}.keypoints li+li{margin-top:4px}.followups{display:grid;gap:9px;margin-top:16px}.followup{padding:14px 15px;border:1px solid color-mix(in srgb,var(--purple) 28%,var(--line));border-radius:12px;background:linear-gradient(110deg,var(--purple-soft),var(--paper))}.followup-question{display:block;color:var(--purple);font-size:13px;font-weight:850}.followup-answer{margin-top:7px!important;color:var(--ink);font-size:13px!important}.code-sample{margin-top:15px;overflow:hidden;border:1px solid #344154;border-radius:12px;background:#17202f}.code-head{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;color:#c7d2df;border-bottom:1px solid #344154;font:750 11px/1 var(--mono)}.code-head span:last-child{color:#f6d654}.code-sample pre{margin:0;padding:15px;overflow:auto;color:#edf2f7;font:12px/1.65 var(--mono);tab-size:4}.code-sample code{font:inherit}.comparison-wrap{margin-top:16px;overflow-x:auto;border:1px solid var(--line);border-radius:12px}.comparison{width:100%;min-width:720px;border-collapse:collapse;font-size:12px}.comparison th,.comparison td{padding:10px 11px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;vertical-align:top}.comparison th:last-child,.comparison td:last-child{border-right:0}.comparison tr:last-child td{border-bottom:0}.comparison th{color:var(--blue-deep);background:var(--blue-soft);font-size:11px;white-space:nowrap}.comparison td:first-child{font-weight:850;white-space:nowrap}.source-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.source-link{padding:6px 9px;border:1px solid var(--line);border-radius:9px;color:var(--blue-deep);background:var(--blue-soft);font-size:10px;font-weight:750}.answer-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.small-button,.deep-link{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:11px;font-weight:750}.small-button:hover,.deep-link:hover{background:var(--blue-soft)}.small-button.saved{color:var(--yellow-deep);background:var(--yellow-soft)}.small-button.done{color:var(--mint);background:var(--mint-soft)}
    .empty{display:none;padding:60px 20px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);background:var(--paper);text-align:center}.empty b{display:block;margin-bottom:6px;color:var(--ink);font-size:18px}.footer{max-width:920px;margin:auto;padding:0 22px 70px;color:var(--muted);text-align:center;font-size:12px}.footer:before{content:"";display:block;width:62px;height:3px;margin:0 auto 20px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--yellow))}.back-to-top{position:fixed;right:20px;bottom:20px;z-index:60;width:44px;height:44px;border:0;border-radius:14px;color:#fff;background:var(--ink);opacity:0;pointer-events:none;transform:translateY(8px);transition:.16s}.back-to-top.visible{opacity:1;pointer-events:auto;transform:none}
    @media(max-width:850px){.workspace{grid-template-columns:1fr}.sidebar{position:static}.topic-list{display:flex;overflow-x:auto}.topic-button{min-width:max-content}.sidebar-note{display:none}.toolbar{top:74px}.stats{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.brand-text{display:none}.hero,.main{padding-left:14px;padding-right:14px}.stats{gap:8px}.stat{padding:13px}.stat b{font-size:21px}.search-row{display:grid}.random-button{height:42px}.question-main{grid-template-columns:auto 1fr;padding:15px;gap:11px}.chevron{display:none}.answer{padding:0 15px 15px}.result-head{align-items:start;gap:12px}.result-head p{text-align:right}}
    @media print{.topbar,.progress-track,.sidebar,.toolbar,.back-to-top,.answer-actions{display:none!important}.workspace{display:block}.question-card{break-inside:avoid;box-shadow:none}.answer{display:block!important}body{background:#fff}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
  <header class="topbar">
    <a class="brand" href="#top"><span class="brand-mark">QA</span><span class="brand-text">AI 面试真题库</span></a>
    <div class="top-actions"><button class="icon-button" id="themeButton" type="button" aria-label="切换深浅色模式" title="切换深浅色模式">◐</button></div>
  </header>

  <header class="hero" id="top">
    <div class="eyebrow">Interview Question Bank</div>
    <h1>把零散的面试题，<br>变成<span>可追踪的能力地图</span></h1>
    <p class="hero-copy">围绕 AI 应用工程师常见面试方向整理。先用 30 秒说结论，再根据追问展开原理、工程取舍和故障排查。</p>
    <div class="stats" aria-label="题库统计">
      <div class="stat"><b id="totalStat">0</b><span>收录题目</span></div>
      <div class="stat"><b id="topicStat">0</b><span>面试方向</span></div>
      <div class="stat"><b id="masteredStat">0</b><span>已掌握</span></div>
      <div class="stat"><b id="savedStat">0</b><span>已收藏</span></div>
    </div>
  </header>

  <main class="main">
    <div class="workspace">
      <aside class="sidebar">
        <h2 class="sidebar-title">按方向复习</h2>
        <div class="topic-list" id="topicList"></div>
        <div class="sidebar-note"><b>回答节奏</b><br>30 秒结论 → 2 分钟原理 → 结合项目举例 → 主动说出边界和取舍。</div>
      </aside>

      <section class="content" aria-label="面试题列表">
        <div class="toolbar">
          <div class="search-row">
            <label class="search-wrap"><span>⌕</span><input class="search" id="searchInput" type="search" placeholder="搜题目、答案或关键词…" autocomplete="off"></label>
            <button class="random-button" id="randomButton" type="button">🎲 随机抽题</button>
          </div>
          <div class="filters" id="difficultyFilters" aria-label="题目筛选">
            <button class="filter active" data-difficulty="全部" type="button">全部难度</button>
            <button class="filter" data-difficulty="基础" type="button">基础</button>
            <button class="filter" data-difficulty="进阶" type="button">进阶</button>
            <button class="filter" data-difficulty="困难" type="button">困难</button>
            <button class="filter" data-difficulty="收藏" type="button">★ 只看收藏</button>
            <button class="filter" data-difficulty="未掌握" type="button">○ 只看未掌握</button>
          </div>
        </div>
        <div class="result-head"><h2 id="resultTitle">全部题目</h2><p id="resultCount">共 0 题</p></div>
        <div class="question-list" id="questionList"></div>
        <div class="empty" id="emptyState"><b>没有匹配的题目</b>换个关键词或清除筛选条件试试。</div>
      </section>
    </div>
  </main>
  <footer class="footer">AI 面试真题汇总 · 不只背答案，还要能承接追问、说清取舍</footer>
  <button class="back-to-top" id="backToTop" type="button" aria-label="返回顶部">↑</button>

  <script>
    const questions = [
      {id:1,topic:"Python",difficulty:"基础",title:"Python 的 list、tuple、set 和 dict 分别适合什么场景？",answer:"先按“是否有序、是否可变、是否需要去重、是否按键查找”回答。list 是有序可变序列，tuple 是有序不可变记录，set 主要用于去重和集合运算，dict 用键映射值。",points:["dict 和 set 基于哈希，平均查找是 O(1)","tuple 仅在内部元素可哈希时才可作为 dict 的键","Python 3.7+ 的 dict 保留插入顺序"],link:"1-1.Python速通与JavaScript对比.html"},
      {id:2,topic:"Python",difficulty:"进阶",title:"Python 的生成器为什么节省内存？yield 发生了什么？",answer:"yield 会产生一个惰性迭代器，函数每次运行到 yield 时交出一个值并保留当前栈帧状态，下次从停顿处继续，不需要一次把全部结果放进内存。",points:["适合大文件、流式数据和管道处理","生成器通常只能向前消费一次","节省内存不等于一定更快"],link:"1-1.Python速通与JavaScript对比.html"},
      {id:3,topic:"Python",difficulty:"进阶",title:"asyncio 的并发和多线程、多进程有什么区别？",answer:"asyncio 是单线程事件循环中的协作式并发，适合大量 I/O 等待；线程也适合 I/O，但有线程调度和共享状态问题；多进程能绕开 CPython GIL，更适合 CPU 密集计算。",points:["await 只在可等待点交出控制权","CPU 密集代码会阻塞事件循环","LLM/API 批量请求常用 asyncio + 并发限流"],link:"1-1.Python速通与JavaScript对比.html"},
      {id:4,topic:"Transformer",difficulty:"基础",title:"Self-Attention 里的 Q、K、V 分别是什么？",answer:"Q 表示当前 token 想找什么，K 表示每个 token 能被什么匹配，QKᵀ 算相关性；V 是真正被加权汇总的信息。三者都由输入经不同线性投影得到。",points:["相似度用 Q 与 K 计算，不是 Q 与 V","softmax 后的权重与 V 加权求和","要能说出张量形状变化"],link:"2-4.Multihead-Attention.html"},
      {id:5,topic:"Transformer",difficulty:"进阶",title:"Attention 为什么要除以 √dₖ？",answer:"dₖ 较大时，Q·K 的方差会随维度增大，分数过大会让 softmax 进入饱和区，权重过尖且梯度很小。除以 √dₖ 用来稳定分数尺度和训练。",points:["核心是方差尺度，不是为了归一化到 0~1","softmax 自身才输出概率分布","dₖ 是每个 head 的 key 维度"],link:"2-4.Multihead-Attention.html"},
      {id:6,topic:"Transformer",difficulty:"进阶",title:"Multi-Head Attention 比单头好在哪里？",answer:"多头把表示空间分成多个子空间，允许不同头同时学习语法、指代、位置等不同关系，再拼接并通过 Wᵒ 混合。它提升表示能力，但不保证每个头都有可解释语义。",points:["分头后每头维度通常是 d_model / h","头数增多不会免除 O(n²) 序列复杂度","Concat 后还需要输出投影 Wᵒ"],link:"2-5.手搓Transformer.html"},
      {id:7,topic:"Transformer",difficulty:"困难",title:"Pre-Norm 和 Post-Norm 有什么区别？为什么现代 LLM 常用 Pre-Norm？",answer:"Post-Norm 先做子层与残差相加，再归一化；Pre-Norm 在进子层前归一化，残差主干保留更直接的梯度通道，深层模型通常更易稳定训练。",points:["Pre-Norm 更稳定不代表理论上总是更好","LLM 中还常用 RMSNorm","回答时画出 x + F(Norm(x))"],link:"2-6.LayerNormalization.html"},
      {id:8,topic:"Transformer",difficulty:"基础",title:"Transformer 没有循环结构，怎么知道 token 的顺序？",answer:"Self-Attention 本身对排列不敏感，所以需要向 token embedding 注入位置信息。原始 Transformer 用正弦/余弦绝对位置编码，现代 LLM 常用 RoPE 将相对位置体现到 Q/K 的旋转中。",points:["位置信息和 causal mask 职责不同","RoPE 不是把一个位置向量直接加到输入","超长上下文需考虑位置外推"],link:"2-1.Transformer & MOE.html"},
      {id:9,topic:"RAG",difficulty:"基础",title:"RAG 和微调有什么区别？怎么选？",answer:"RAG 在推理时检索外部证据，适合知识频繁变化、需要引用和权限控制的场景；微调主要改变模型的行为、风格或任务能力。知识问题通常先考虑 RAG，两者也可组合。",points:["RAG 的知识可更新、可追溯","Fine-tuning 不是可靠的数据库","用评估集验证选型，不靠感觉"],link:"3-5.RAG从入门到进阶.html"},
      {id:10,topic:"RAG",difficulty:"进阶",title:"Chunk Size 越大越好吗？如何选切块策略？",answer:"不是。块太大会混入多个主题，向量表示和生成上下文都变得含噪；块太小又会切断完整事实。应从文档结构和真实问题出发，对比多组 chunk size/overlap 的召回与答案指标。",points:["保留标题、页码、来源等 metadata","先看证据是否被切断，再调参","Parent-child 检索可兼顾小块匹配和大块上下文"],link:"3-5.RAG从入门到进阶.html"},
      {id:11,topic:"RAG",difficulty:"进阶",title:"Embedding 检索、BM25 和 Rerank 各解决什么问题？",answer:"Embedding 擅长语义相似，BM25 擅长精确关键词、编号和稀有词；混合检索先扩大候选覆盖，Reranker 再对 query-document 对做更精细的相关性判断，提升头部精度。",points:["召回阶段优先避免漏掉证据","Rerank 更准但有额外延迟和成本","需要调整候选数和最终 top-k"],link:"3-6.RAG全链路优化.html"},
      {id:12,topic:"RAG",difficulty:"困难",title:"RAG 线上回答不准，你会怎么定位？",answer:"先分段定位，不要盲目调 Prompt。检查原文是否可解析，答案证据是否存在于 chunk，retriever 是否召回它，rerank/filter 是否误杀，上下文组装是否丢失，最后才看模型是否忽略证据。",points:["记录 query、改写结果、候选块、score、引用和耗时","分开评估 retrieval quality 与 answer quality","使用固定评估集回归，避免修好一题弄坏全局"],link:"3-6.RAG全链路优化.html"},
      {id:13,topic:"RAG",difficulty:"困难",title:"如何评估一个 RAG 系统？",answer:"建立来自真实业务的带标注评估集，分层看检索和生成。检索可看 Recall@k、MRR/nDCG，生成看正确性、忠实性、引用准确率和拒答能力，同时跟踪延迟、成本与用户反馈。",points:["评估集要包含不可回答的反例","LLM-as-a-judge 需校准，不能是唯一标准","上线前离线回归，上线后持续监控分布漂移"],link:"3-6.RAG全链路优化.html"},
      {id:14,topic:"Agent",difficulty:"基础",title:"Agent 和普通 Workflow 的核心区别是什么？",answer:"Workflow 的步骤和分支主要由开发者预先编排，Agent 则让模型在运行时根据目标和观察自主选择下一个动作。路径稳定、合规要求高时优先 Workflow，开放任务再引入受约束的 Agent。",points:["自主性带来更大灵活性也带来不确定性","生产 Agent 必须有最大步数、超时、权限和审计","很多被叫做 Agent 的系统实际是 LLM Workflow"],link:"4-1.Agent文档解析与工作流.html"},
      {id:15,topic:"Agent",difficulty:"进阶",title:"Function Calling 的完整消息闭环是什么？",answer:"应用先把工具 schema 和用户消息发给模型；模型只返回工具名和参数，应用校验后真正执行；再把结果通过对应 tool_call_id 放回会话，请模型生成最终答案。",points:["模型不会自动执行你的本地函数","arguments 要做 schema 与业务双重校验","流式返回时要按 tool call index 累积参数片段"],link:"4-1.Agent文档解析与工作流.html"},
      {id:16,topic:"Agent",difficulty:"困难",title:"怎么防止 Agent 无限循环、误调高风险工具？",answer:"在模型外用确定性编排器建立边界：最大步数与总时限、工具 allowlist、参数校验、幂等键、重试上限、费用预算，以及删除/付款等副作用操作的人工确认。",points:["用状态机明确 running/succeeded/failed/cancelled","tool output 是不可信输入，要防 prompt injection","全链路保留 trace，能回放每一步决策"],link:"4-2.分布式_Worker_集群可靠调度与故障恢复.html"},
      {id:17,topic:"工程化",difficulty:"进阶",title:"LLM 接口如何做超时、重试和限流？",answer:"重试只针对短暂性错误，使用指数退避加 jitter，并设置单次超时、总 deadline 和重试次数上限。客户端用信号量限制并发，服务端按用户/租户做速率与 token 配额，还要避免超时后的幽灵请求。",points:["400 参数错误通常不应重试，429/5xx 需分类","串联调用应传递剩余 deadline","fallback 模型要有质量与成本边界"],link:"4-2.分布式_Worker_集群可靠调度与故障恢复.html"},
      {id:18,topic:"工程化",difficulty:"困难",title:"如何设计一个可观测的 LLM 应用？",answer:"以一个 trace 串起用户请求、模型调用、检索和工具执行。记录模型/提示版本、token、首 token/总耗时、错误类型、工具参数摘要和评估结果，同时做隐私脱敏和采样。",points:["技术指标与任务成功率要同时看","prompt/model/index 都要有可回滚版本","日志不应直接保存密钥和敏感原文"],link:"4-2.分布式_Worker_集群可靠调度与故障恢复.html"},
      {id:19,topic:"工程化",difficulty:"进阶",title:"模型输出为什么要用结构化输出？仍然会失败吗？",answer:"结构化输出把模型和代码之间的自然语言约定升级为 schema 契约，能减少解析歧义并使业务分支更可测试。但 schema 合法不代表语义正确，仍需范围、权限、一致性等业务校验。",points:["区分语法验证与语义验证","解析失败要有重试、修复或降级策略","schema 变更需要兼容和版本管理"],link:"1-1.Python速通与JavaScript对比.html"},
      {id:20,topic:"工程化",difficulty:"困难",title:"如何降低 LLM 应用的延迟和成本？",answer:"先用指标分解成本和时延，再定点优化：缩短系统提示和上下文，缓存可复用结果，并行无依赖调用，流式输出降低感知延迟，简单任务路由小模型，并为批量任务使用异步队列。",points:["分清 TTFT 和总生成时间","Prompt caching 需稳定的前缀结构","任何降级都要通过质量回归评估"],link:"4-2.分布式_Worker_集群可靠调度与故障恢复.html"},
      {id:21,topic:"Transformer",difficulty:"进阶",real:true,company:"字节跳动",title:"在 Transformer 架构中，什么是 Layer Normalization 和 Batch Normalization？为何选择 Layer Normalization 而非 Batch Normalization？",answer:"对形状为 [B, T, D] 的 Transformer 隐状态，Layer Normalization 会对每个样本的每个 token，沿特征维 D 独立计算均值和方差；Batch Normalization 则对同一特征或通道，跨 batch 样本计算统计量。Transformer 选择 LayerNorm，主要因为它不依赖 batch 大小和其他样本，能适配变长序列、小 batch 及自回归逐 token 推理，而且训练和推理阶段使用统计量的方式一致。",points:["LayerNorm：对单个 token 的 D 个特征归一化，然后用可学习的 γ、β 做缩放和平移","BatchNorm：训练时依赖当前 batch 统计量，推理时通常使用移动平均，小 batch 下估计容易不稳定","NLP 序列长度和 padding 情况不同，跨样本聚合统计量不如每个 token 独立归一化自然","LayerNorm 并非所有网络都优于 BatchNorm；BatchNorm 在 CNN 等固定通道结构中仍非常有效"],link:"2-6.LayerNormalization.html"},
      {id:22,topic:"Transformer",difficulty:"困难",real:true,company:"快手、字节跳动",title:"除了标准多头注意力 MHA，主流大模型中还广泛应用了哪些改进型注意力机制（如 GQA、MQA、MLA）？",answer:"这些改进的核心动机，是降低自回归解码时 KV Cache 的容量和反复读取它的内存带宽，而不是消除注意力对序列长度的二次方复杂度。记查询头数为 Hq、KV 头数为 Hkv：MHA 中 Hkv=Hq；MQA 中 Hkv=1；GQA 中 1<Hkv<Hq；MLA 则不直接缓存每个 KV 头，而是缓存联合低秩压缩后的 latent 表示，使用时再投影到各头。",points:["MHA：每个 Q 头都有独立 K/V，表示能力最完整，但 KV Cache 与解码带宽成本最高","MQA：所有 Q 头共享唯一一组 K/V，KV Cache 相对 MHA 约缩小 Hq 倍，解码吞吐高，但共享过强可能损失质量","GQA：把 Q 头分组，组内共享一组 K/V；当 Hkv=G 时，KV Cache 约为 MHA 的 G/Hq，通常以接近 MHA 的质量换取接近 MQA 的推理效率","MLA：对 K/V 做联合低秩压缩，只缓存低维 latent；配合解耦 RoPE 和矩阵吸收，进一步减少长上下文的缓存与带宽，但训练、推理内核和工程实现更复杂","KV Cache 粗略与 2×层数×序列长×Hkv×头维度×数据类型字节数成正比；MQA/GQA 主要降低 Hkv，MLA 主要降低实际缓存的表示维度","QKᵀ 和 attention·V 的主体计算并不会按 KV 头数等比消失；最显著的收益常在 decode 阶段的缓存容量、内存带宽和可承载 batch 大小"],comparison:[["MHA","Hq 组独立 K/V","1× 基线","KV 投影与读取最高","质量上限高，适合对表示容量敏感的场景"],["MQA","Hq 组 Q 共享 1 组 K/V","约 1/Hq","decode 带宽最低，算力降幅较小","吞吐优先；可能有质量损失"],["GQA","Hq 组 Q 共享 G 组 K/V","约 G/Hq","decode 效率介于 MHA/MQA","质量与效率最常用的平衡点"],["MLA","KV 联合低秩 latent + 解耦位置信息","取决于 latent 维度，可远小于 MHA","减少缓存/带宽，增加投影与内核复杂度","超长上下文和高并发推理优势明显"]],comparisonHeaders:["机制","结构","相对 KV Cache","效率/计算","质量与场景"],sources:[{label:"MQA 原始论文",url:"https://arxiv.org/abs/1911.02150"},{label:"GQA 原始论文",url:"https://arxiv.org/abs/2305.13245"},{label:"Llama 3 官方模型卡",url:"https://github.com/meta-llama/llama-models/blob/main/models/llama3/MODEL_CARD.md"},{label:"DeepSeek-V2 / MLA 论文",url:"https://arxiv.org/abs/2405.04434"}],link:"2-4.Multihead-Attention.html"}
    ];

      title:"给定由 '1'（陆地）和 '0'（水）组成的二维网格，使用 DFS 或 BFS 计算岛屿数量，并分析复杂度。",
      answer:"从左到右、从上到下扫描每个格子。每当遇到一个尚未访问的 '1'，就说明发现了一座新岛屿，计数加一；随后从该位置用 DFS 或 BFS 沿上下左右扩展，将这座岛屿的所有陆地标记为已访问。下面的实现直接把访问过的 '1' 改为 '0'，因此不需要额外 visited 集合。",
      points:[
        "判定新岛屿的时机是主循环首次遇到 '1'，不是在 DFS/BFS 访问每个陆地时都加一",
        "每个格子最多被扫描和访问常数次，所以时间复杂度是 O(m×n)",
        "递归 DFS 的调用栈或 BFS 的队列，最坏可容纳整座岛屿，空间复杂度上界为 O(m×n)",

        "只认上下左右四连通，对角线相邻不属于同一座岛；还要处理空网格、单行/单列和全为水等边界",
        "递归 DFS 代码更短，但大网格可能超过 Python 递归深度；迭代 DFS/BFS 在面试工程实现中更稳妥"

        {
          title:"DFS 实现（推荐，代码短）",
          language:"Python",
          code:`def numIslands(grid):
    if not grid: return 0
    m, n = len(grid), len(grid[0])
    count = 0

    def dfs(i, j):
        if i < 0 or i >= m or j < 0 or j >= n or grid[i][j] != '1':
            return
        grid[i][j] = '0'  # 标记已访问
        dfs(i+1, j)
        dfs(i-1, j)
        dfs(i, j+1)
        dfs(i, j-1)

    for i in range(m):
        for j in range(n):
            if grid[i][j] == '1':
                dfs(i, j)
                count += 1
    return count`
        },

          title:"BFS 实现（用队列，避免递归栈溢出）",
          language:"Python",
          code:`from collections import deque

def numIslands(grid):
    if not grid: return 0
    m, n = len(grid), len(grid[0])
    count = 0

    for i in range(m):
        for j in range(n):
            if grid[i][j] == '1':
                count += 1
                queue = deque([(i, j)])
                grid[i][j] = '0'
                while queue:
                    x, y = queue.popleft()
                    for dx, dy in [(0,1),(0,-1),(1,0),(-1,0)]:
                        nx, ny = x + dx, y + dy
                        if 0 <= nx < m and 0 <= ny < n and grid[nx][ny] == '1':
                            grid[nx][ny] = '0'
                            queue.append((nx, ny))

    return count`
        }

      answer:"两题都把状态定义为“必须以当前元素结尾”的最优解。最大和只需维护 current_max：前缀和为负时，它只会拖累当前元素，因此在“从当前数重新开始”和“接到上一段后面”中取大值。最大乘积必须同时保留 current_max 和 current_min，因为负数会翻转大小关系：上一步的最小负积乘以负数，可能立刻成为最大正积。",

      ],

          language:"Python",
          code:`def max_subarray_sum(nums):
    if not nums:
        raise ValueError("nums must contain at least one number")

    current_max = best = nums[0]

    for value in nums[1:]:
        # 要么从 value 重新开始，要么延续前一段子数组
        current_max = max(value, current_max + value)
        best = max(best, current_max)

    return best`

    if not nums:
        raise ValueError("nums must contain at least one number")

    current_max = current_min = best = nums[0]

    for value in nums[1:]:
        previous_max, previous_min = current_max, current_min
        current_max = max(value, previous_max * value, previous_min * value)
        current_min = min(value, previous_max * value, previous_min * value)
        best = max(best, current_max)

    return best`

    });
    document.getElementById("randomButton").addEventListener("click",()=>{ const list=filteredQuestions(); if(!list.length)return; const q=list[Math.floor(Math.random()*list.length)]; const card=document.querySelector(`[data-id="${q.id}"]`); card.classList.add("open"); card.querySelector(".question-main").setAttribute("aria-expanded","true"); card.scrollIntoView({behavior:"smooth",block:"center"}); });
    const root=document.documentElement, themeButton=document.getElementById("themeButton"); try{ const savedTheme=localStorage.getItem("interview-page-theme"); if(savedTheme)root.dataset.theme=savedTheme; }catch(_){} themeButton.addEventListener("click",()=>{ root.dataset.theme=root.dataset.theme==="dark"?"light":"dark"; localStorage.setItem("interview-page-theme",root.dataset.theme); });
    const progressBar=document.getElementById("progressBar"), backToTop=document.getElementById("backToTop"); function onScroll(){ const total=document.documentElement.scrollHeight-innerHeight; progressBar.style.width=`${total>0?scrollY/total*100:0}%`; backToTop.classList.toggle("visible",scrollY>600); } addEventListener("scroll",onScroll,{passive:true}); backToTop.addEventListener("click",()=>scrollTo({top:0,behavior:"smooth"}));
    render(); onScroll();
  </script>
</body>
</html>
