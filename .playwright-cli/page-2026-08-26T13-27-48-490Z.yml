      - heading "SECTION 16 Multi-Head Attention" [level=2] [ref=e2505]
      - blockquote [ref=e2506]:
        - paragraph [ref=e2507]: Multi-Head Attention 本质上是并行执行多组 Attention。每个 Head 都有独立的 Q/K/V 投影参数，将同一个输入映射到不同的表示子空间，因此不同 Head 可以学习不同类型的 Token 关系。最后将多个 Head 的输出进行 Concat，再经过一个线性输出投影得到最终结果。 严格来说，不是简单把输入维度机械切成几份，而是通过不同的可学习投影矩阵，把同一个输入映射到多个低维子空间。
