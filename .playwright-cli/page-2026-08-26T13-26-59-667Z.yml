      - heading "SECTION 15 15. 面试记忆版" [level=2] [ref=e507]
      - heading "进程、线程、协程" [level=3] [ref=e508]
      - blockquote [ref=e509]:
        - paragraph [ref=e510]: CPU 密集型任务通常使用多进程利用多核；传统阻塞式 I/O 可以使用多线程；大量网络 I/O、高并发任务适合 asyncio 协程。
      - heading "await" [level=3] [ref=e511]
      - blockquote [ref=e512]:
        - paragraph [ref=e513]:
          - code [ref=e514]: await
          - text: 遇到未完成的异步操作时挂起当前协程，把控制权交还 Event Loop；异步操作完成后再恢复当前协程。
      - heading "yield" [level=3] [ref=e515]
      - blockquote [ref=e516]:
        - paragraph [ref=e517]:
          - code [ref=e518]: yield
          - text: 会产出一个值并暂停生成器，调用方获取这个值后，下一次请求数据时再从上次暂停的位置继续执行。
      - heading "await 与 yield" [level=3] [ref=e519]
      - blockquote [ref=e520]:
        - paragraph [ref=e521]:
          - code [ref=e522]: await
          - text: 主要解决"异步等待"，
          - code [ref=e523]: yield
          - text: 主要解决"逐步产出"。
      - heading "async for" [level=3] [ref=e524]
      - blockquote [ref=e525]:
        - paragraph [ref=e526]:
          - code [ref=e527]: async for
          - text: 用于消费异步迭代器，可以粗略理解为不断执行
          - code [ref=e528]: await iterator.__anext__()
          - text: ，因此它能够异步等待下一次
          - code [ref=e529]: yield
          - text: 的结果。
      - heading "Agent Streaming" [level=3] [ref=e530]
      - blockquote [ref=e531]:
        - paragraph [ref=e532]:
          - text: Agent 中通常通过
          - code [ref=e533]: await
          - text: 非阻塞地等待 LLM、RAG、Tool 等 I/O，通过
          - code [ref=e534]: yield
          - text: 将已经得到的阶段性结果逐步交给上层，再由 SSE、WebSocket 或 HTTP Streaming 推送给前端。
      - separator [ref=e535]
      - heading "SECTION 16 16. 最值得记住的几句话" [level=2] [ref=e536]
      - generic [ref=e537]:
        - generic [ref=e538]:
          - generic [ref=e539]: text
          - button "复制" [ref=e540] [cursor=pointer]
        - code [ref=e542]: await = 没结果，我先等，让别人跑。 yield = 有一个结果，我先给出去。 async for = 我不断异步等你下一个结果。 Event Loop = 谁可以继续执行，我来调度。 SSE / WebSocket = 把 yield 出来的结果真正传给浏览器。
      - paragraph [ref=e543]: 最终：
      - generic [ref=e544]:
        - generic [ref=e545]:
          - generic [ref=e546]: text
          - button "复制" [ref=e547] [cursor=pointer]
        - code [ref=e549]: await 解决等待 ↓ yield 解决生产 ↓ async for 解决消费 ↓ SSE / WebSocket 解决网络传输 ↓ 前端解决实时渲染
