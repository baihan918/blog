          - generic [ref=e144]:
            - generic [ref=e145]: ✓
            - heading "幂等执行" [level=3] [ref=e146]
            - paragraph [ref=e147]: 给有副作用的动作附加 idempotency_key。同一业务意图重复提交时，服务端返回第一次结果，不再重复执行。
        - generic [ref=e148]:
