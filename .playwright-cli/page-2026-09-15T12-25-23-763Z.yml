        - generic [ref=e136]: 04 · THE MOST DANGEROUS GAP
        - heading "先确认副作用，再谈重试" [level=2] [ref=e137]
        - paragraph [ref=e138]: 真实系统里最危险的情况不是“明确失败”，而是请求超时后，客户端以为失败，服务端其实已经完成。此时直接重试，可能重复扣款、重复下单或重复发消息。
