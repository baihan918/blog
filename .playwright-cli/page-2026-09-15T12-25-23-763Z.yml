            - heading "第一步：重试" [level=3] [ref=e74]
            - paragraph [ref=e75]: 工具返回结构化错误。网络抖动、超时、限流等临时错误，在预算内指数退避，并加入随机抖动，避免同一时刻集中重试。
          - generic [ref=e76]:
            - generic [ref=e77]: ⇄
            - heading "第二步：换路" [level=3] [ref=e78]
            - paragraph [ref=e79]: 改变参数、切换工具或降级目标。系统要说清上次为什么失败，以及新旧动作有什么实质差异。
          - generic [ref=e80]:
            - generic [ref=e81]: ⌘
            - heading "第三步：Replan" [level=3] [ref=e82]
            - paragraph [ref=e83]: 参数和工具都无法推进时，从最近检查点恢复，把目标、已完成结果、阻塞和无效路径交给 Planner，生成新版计划。
        - generic [ref=e84]:
