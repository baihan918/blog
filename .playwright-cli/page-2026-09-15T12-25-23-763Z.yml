        - heading "重试是一种受控实验，不是循环祈祷" [level=2] [ref=e156]
        - generic [ref=e157]:
          - generic [ref=e158]:
            - generic [ref=e159]: BACKOFF
            - paragraph [ref=e160]: 等待时间指数增长，并尊重服务端 Retry-After。
            - generic [ref=e161]: 1s → 2s → 4s
          - generic [ref=e162]:
            - generic [ref=e163]: JITTER
            - paragraph [ref=e164]: 加入随机偏移，避免大量任务同时醒来形成重试风暴。
            - generic [ref=e165]: ± RANDOM
          - generic [ref=e166]:
            - generic [ref=e167]: BUDGET
            - paragraph [ref=e168]: 同时限制重试次数、总耗时、Token、工具调用次数和真实费用。
            - generic [ref=e169]: HARD LIMIT
          - generic [ref=e170]:
            - generic [ref=e171]: CIRCUIT
            - paragraph [ref=e172]: 同一工具或服务连续失败时，对该故障域熔断；不要轻易停止所有 Agent。
