            - generic [ref=e150]: safe retry with idempotency
            - button "复制" [ref=e151] [cursor=pointer]
          - code [ref=e153]: "key = \"send-report:report_123:user_456\" result = send_report(payload, idempotency_key=key) if result.timeout: status = get_operation(result.operation_id) if status == \"completed\": return load_previous_result(key) if status == \"not_started\": return retry_with_same_key()"
