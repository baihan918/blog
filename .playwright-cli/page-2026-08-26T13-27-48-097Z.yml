      - heading "SECTION 15 15. 面试记忆版" [level=2] [ref=e509]
      - heading "进程、线程、协程" [level=3] [ref=e510]
      - blockquote [ref=e511]:
        - paragraph [ref=e512]: CPU 密集型任务通常使用多进程利用多核；传统阻塞式 I/O 可以使用多线程；大量网络 I/O、高并发任务适合 asyncio 协程。
      - heading "await" [level=3] [ref=e513]
      - blockquote [ref=e514]:
        - paragraph [ref=e515]:
          - code [ref=e516]: await
          - text: 遇到未完成的异步操作时挂起当前协程，把控制权交还 Event Loop；异步操作完成后再恢复当前协程。
      - heading "yield" [level=3] [ref=e517]
      - blockquote [ref=e518]:
        - paragraph [ref=e519]:
          - code [ref=e520]: yield
          - text: 会产出一个值并暂停生成器，调用方获取这个值后，下一次请求数据时再从上次暂停的位置继续执行。
      - heading "await 与 yield" [level=3] [ref=e521]
      - blockquote [ref=e522]:
        - paragraph [ref=e523]:
          - code [ref=e524]: await
          - text: 主要解决"异步等待"，
          - code [ref=e525]: yield
          - text: 主要解决"逐步产出"。
      - heading "async for" [level=3] [ref=e526]
      - blockquote [ref=e527]:
        - paragraph [ref=e528]:
          - code [ref=e529]: async for
          - text: 用于消费异步迭代器，可以粗略理解为不断执行
          - code [ref=e530]: await iterator.__anext__()
          - text: ，因此它能够异步等待下一次
          - code [ref=e531]: yield
          - text: 的结果。
      - heading "Agent Streaming" [level=3] [ref=e532]
      - blockquote [ref=e533]:
        - paragraph [ref=e534]:
          - text: Agent 中通常通过
          - code [ref=e535]: await
          - text: 非阻塞地等待 LLM、RAG、Tool 等 I/O，通过
          - code [ref=e536]: yield
          - text: 将已经得到的阶段性结果逐步交给上层，再由 SSE、WebSocket 或 HTTP Streaming 推送给前端。
      - separator [ref=e537]
      - heading "SECTION 16 16. 最值得记住的几句话" [level=2] [ref=e538]
      - generic [ref=e539]:
        - generic [ref=e540]:
          - generic [ref=e541]: text
          - button "复制" [ref=e542] [cursor=pointer]
        - code [ref=e544]: await = 没结果，我先等，让别人跑。 yield = 有一个结果，我先给出去。 async for = 我不断异步等你下一个结果。 Event Loop = 谁可以继续执行，我来调度。 SSE / WebSocket = 把 yield 出来的结果真正传给浏览器。
      - paragraph [ref=e545]: 最终：
      - generic [ref=e546]:
        - generic [ref=e547]:
          - generic [ref=e548]: text
          - button "复制" [ref=e549] [cursor=pointer]
        - code [ref=e551]: await 解决等待 ↓ yield 解决生产 ↓ async for 解决消费 ↓ SSE / WebSocket 解决网络传输 ↓ 前端解决实时渲染
