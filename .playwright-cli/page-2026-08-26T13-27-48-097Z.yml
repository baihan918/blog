        - code [ref=e507]: Event Loop │ ┌──────────┴──────────┐ │ │ 消费者协程 Agent │ │ async for chunk │ │ │ await __anext__() ───────→ 开始执行 │ │ │ await RAG / Tool │ │ │ 暂停等待 │ │ │ I/O 完成恢复 │ │ │ yield chunk │ │ └──── 得到 chunk ←────┘ │ 处理 / SSE 发送 │ 再 await __anext__() │ └──────────────→ Agent 从上次 yield 后继续
