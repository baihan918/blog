      - heading "SECTION 143 104. Checkpoint / Resume 面试回答" [level=1] [ref=e3836]
      - paragraph [ref=e3837]: 如果面试官问：
      - blockquote [ref=e3838]:
        - paragraph [ref=e3839]: Agent Workflow 执行到一半服务挂了怎么办？
      - paragraph [ref=e3840]: 可以回答：
      - blockquote [ref=e3841]:
        - paragraph [ref=e3842]: 对于长生命周期 Agent Workflow，我不会依赖进程内状态，而是持久化 Workflow State 和 Node State，通过 Checkpoint 记录可靠执行点。服务恢复后加载 Checkpoint，找到未完成节点，并结合 Task Lease 判断上一次 Worker 是否已经失效。对于可能重复执行的节点，还需要通过稳定的 execution key、artifact key 或 Tool operation_id 做幂等，避免外部副作用已经成功但 Checkpoint 尚未更新时重复执行。如果流程需要人工审批，则在节点完成后持久化 Checkpoint，将 Workflow 置为 waiting_human 并释放 Worker，收到人工事件后再 Resume。
      - separator [ref=e3843]
      - heading "SECTION 144 105. 这一站必须记住的六句话" [level=1] [ref=e3844]
      - heading "SECTION 145 1. Checkpoint 的本质" [level=2] [ref=e3845]
      - blockquote [ref=e3846]:
        - paragraph [ref=e3847]:
          - strong [ref=e3848]: 持久化 Workflow 执行状态，使长流程能够断点恢复。
      - heading "SECTION 146 2. Checkpoint 不等于幂等" [level=2] [ref=e3849]
      - blockquote [ref=e3850]:
        - paragraph [ref=e3851]:
          - strong [ref=e3852]: 外部副作用成功但 Checkpoint 写入失败时，仍然可能发生重复执行。
      - heading "SECTION 147 3. 可重试 Node 必须考虑幂等" [level=2] [ref=e3853]
      - blockquote [ref=e3854]:
        - paragraph [ref=e3855]:
          - strong [ref=e3856]: 一个逻辑 Node / Tool Operation 最好拥有稳定 execution key / operation_id。
      - heading "SECTION 148 4. Worker Recovery 与 Workflow Resume 是两层问题" [level=2] [ref=e3857]
      - blockquote [ref=e3858]:
        - paragraph [ref=e3859]:
          - strong [ref=e3860]: Worker 用 Lease / Heartbeat / Retry；Workflow 用 State / Checkpoint / Resume。
      - heading "SECTION 149 5. Human-in-the-loop 不应该一直占 Worker" [level=2] [ref=e3861]
      - blockquote [ref=e3862]:
        - paragraph [ref=e3863]:
          - strong [ref=e3864]: Checkpoint → waiting_human → 释放 Worker → Human Event → Resume。
