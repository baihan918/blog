      - heading "SECTION 109 83. Agent Worker 崩溃怎么办？面试回答" [level=1] [ref=e3063]
      - paragraph [ref=e3064]: 可以回答：
      - blockquote [ref=e3065]:
        - paragraph [ref=e3066]: Agent 长任务不能通过一直持有数据库锁来保证执行权。我会通过任务表中的 status、worker_id、lease_until 建立租约机制，Worker Claim 时用 CAS 原子抢占，执行过程中 Heartbeat 续租。Worker 崩溃后 Lease 到期，允许其他 Worker 重新 Claim。为了防止旧 Worker 恢复后写回旧结果，还会通过 worker_id 或递增的 execution_version / fencing token 验证执行权。临时错误通过 Retry + Exponential Backoff + Jitter 处理，所有有副作用的 Tool 调用需要尽量支持 operation_id 幂等。
