        - paragraph [ref=e2569]: 使用 Transactional Outbox。业务数据和 Outbox Event 在同一个本地数据库事务中提交，后台 Publisher 异步扫描 Outbox 并发送 MQ。Publisher 发送过程允许重试，因此消息可能重复，所以消费者需要通过 event_id、唯一键或 Inbox/processed_event 实现幂等消费。
