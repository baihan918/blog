      - blockquote [ref=e351]:
        - paragraph [ref=e352]: MySQL 默认 RR，是因为它在一致性和性能之间比较均衡。InnoDB 可以通过 MVCC 提供事务内稳定的一致性读取视角，并在加锁读和范围操作中结合 Next-Key Lock 处理很多幻读问题。 但 RR 在一些范围更新、加锁读场景中可能涉及更多 Gap Lock 和锁竞争。如果业务并不要求一个事务内多次查询始终看到同一个快照，那么 RC 可以减少部分锁冲突，因此一些高并发业务会选择 RC。
