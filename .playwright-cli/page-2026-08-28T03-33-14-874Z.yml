        - code [ref=e3023]: 1. 找候选任务 pending retry_wait 到期 running 但 lease 已过期 2. CAS Claim status = running worker_id = A execution_version += 1 lease_until = now + 30s 3. 执行期间 Heartbeat ↓ 持续续租 4. 调用 LLM / Tool 副作用尽量携带 operation_id 保证幂等 5. 成功 CAS 更新 completed 并校验 worker_id / execution_version 6. 失败 判断 Retryable / Non-Retryable 7. 可重试 retry_count += 1 next_retry_at = backoff + jitter status = retry_wait 8. 不可重试 / 超过上限 status = failed 或 DLQ
