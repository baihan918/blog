        - code [ref=e3007]: CREATE TABLE agent_task ( id BIGINT PRIMARY KEY, workflow_id BIGINT, node_id VARCHAR(100), status VARCHAR(20), worker_id VARCHAR(100), execution_version BIGINT NOT NULL DEFAULT 0, lease_until DATETIME, retry_count INT NOT NULL DEFAULT 0, max_retry INT NOT NULL DEFAULT 5, next_retry_at DATETIME, input JSON, result JSON, error_code VARCHAR(100), error_message TEXT, created_at DATETIME, updated_at DATETIME );
