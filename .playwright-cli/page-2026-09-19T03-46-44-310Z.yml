    - article [ref=e47]:
      - heading "SECTION 01 1. 核心结论" [level=2] [ref=e48]
      - paragraph [ref=e49]:
        - text: 提升 Agent Function Calling 灵活性的关键，不是简单给模型提供更多 Function，而是增加一层
        - strong [ref=e50]: Capability（能力）抽象
        - text: ：
      - blockquote [ref=e51]:
        - paragraph [ref=e52]:
          - strong [ref=e53]: Task Understanding → Capability Planning → Tool Router → Tool Registry → Function Calling → Tool Policy → Tool Runtime → Observe → Re-plan
      - paragraph [ref=e54]: 其中：
      - list [ref=e55]:
        - listitem [ref=e56]:
          - strong [ref=e57]: Capability Planning 不直接感知所有具体 Function。
        - listitem [ref=e58]: 它只需要知道系统可以提供哪些“能力”。
        - listitem [ref=e59]: 具体 Function 由 Tool Router / Tool Registry 根据 Capability 动态解析和加载。
        - listitem [ref=e60]: Capability 相对稳定，底层 Tool 可以持续新增、替换和演进。
      - paragraph [ref=e61]: 这可以避免 Tool 数量越来越多后，把几十甚至上百个 Function Schema 一次性塞给 LLM。
