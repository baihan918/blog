      - heading "SECTION 23 20. 三种缓存问题快速记忆" [level=1] [ref=e813]
      - generic [ref=e814]:
        - generic [ref=e815]:
          - generic [ref=e816]: text
          - button "复制" [ref=e817] [cursor=pointer]
        - code [ref=e819]: 缓存穿透 = 查“根本不存在”的数据 = 缓存空值 / Bloom Filter 缓存击穿 = 一个“超级热点 Key”失效 = 互斥锁 / Singleflight / 逻辑过期 缓存雪崩 = “大量 Key”同时失效 = 随机 TTL / 分批过期 / 多级缓存 / 限流
      - separator [ref=e820]
      - heading "SECTION 24 21. 面试回答：缓存和数据库一致性怎么保证？" [level=1] [ref=e821]
      - paragraph [ref=e822]: 可以这样回答：
      - blockquote [ref=e823]:
        - paragraph [ref=e824]: 我通常使用 Cache Aside Pattern。读请求先查缓存，未命中再查询数据库并回填缓存；写请求先更新数据库，再删除缓存，而不是直接更新缓存，这样可以降低并发情况下缓存更新顺序错乱导致的不一致问题。 这种方案本质上还是最终一致性，仍然存在并发读写导致旧数据重新写入缓存的问题，所以会根据业务要求增加 TTL、删除失败重试、MQ 补偿，必要时使用延迟双删。 如果是余额、库存、支付这类强一致业务，不会依赖普通缓存保证最终业务正确性，而是让数据库事务或者原子操作负责业务状态正确，缓存主要作为查询加速层。
      - separator [ref=e825]
      - heading "SECTION 25 22. 面试回答：缓存击穿怎么解决？" [level=1] [ref=e826]
      - paragraph [ref=e827]: 可以这样回答：
      - blockquote [ref=e828]:
        - paragraph [ref=e829]: 对热点 Key 缓存失效导致的大量并发请求，我首先会避免所有请求同时访问数据库。 常见方案是基于 Redis 分布式锁或者 Singleflight 做请求合并，只让一个请求查询数据库并回填缓存，其他请求等待之后重新读取缓存。同时抢到锁之后还要再次查询缓存，也就是 Double Check，避免其他请求已经完成缓存回填之后仍然重复查询数据库。 如果是超级热点数据，我会考虑逻辑过期，让旧缓存继续提供服务，然后只让一个线程异步刷新缓存，从根本上避免缓存失效瞬间大量流量直接进入数据库。 最后还要配合随机 TTL、提前刷新、限流和降级，避免缓存异常进一步演变成数据库雪崩。
      - separator [ref=e830]
      - heading "SECTION 26 23. 最终理解框架" [level=1] [ref=e831]
      - paragraph [ref=e832]: 缓存相关问题可以按照下面几个层次理解：
      - generic [ref=e833]:
        - generic [ref=e834]:
          - generic [ref=e835]: text
          - button "复制" [ref=e836] [cursor=pointer]
        - code [ref=e838]: 第一层：正常缓存 Cache Aside DB = Source of Truth Redis = Performance Layer 第二层：一致性 更新 DB ↓ 删除缓存 ↓ TTL / MQ 补偿 / 必要时延迟双删 第三层：单热点高并发 缓存击穿 ↓ Singleflight ↓ 分布式锁 ↓ Double Check 第四层：超级热点 逻辑过期 ↓ 旧数据继续服务 ↓ 后台异步刷新 第五层：大量缓存同时失效 缓存雪崩 ↓ 随机 TTL ↓ 分批失效 ↓ 多级缓存 第六层：最后防线 限流 ↓ 降级 ↓ 熔断 ↓ 保护 DB
      - paragraph [ref=e839]: 判断具体方案时，优先问三个问题：
      - list [ref=e840]:
        - listitem [ref=e841]:
          - strong [ref=e842]: 业务能不能接受短时间脏数据？
        - listitem [ref=e843]:
          - strong [ref=e844]: 这个数据是读多写少，还是写操作也非常频繁？
        - listitem [ref=e845]:
          - strong [ref=e846]: 缓存错误只是影响展示，还是会造成资金、库存、支付等业务损失？
      - paragraph [ref=e847]: 这三个问题基本决定了应该采用最终一致性、逻辑过期，还是需要把一致性保证下沉到数据库事务和原子业务操作。
