          - article [ref=e352]:
            - heading "为什么很多大模型只校准尺度也够用？" [level=3] [ref=e353]
            - paragraph [ref=e354]: 深层残差网络最直接的训练风险之一，是隐藏向量的整体幅度经过多层后越来越大或越来越小。实践中，RMSNorm 只控制幅度就能提供足够好的稳定性，同时省去减均值步骤，计算更简洁。
