      - generic [ref=e261]:
        - generic [ref=e262]:
          - text: 05 · 回到模型
          - heading "Transformer 为什么更偏爱 LayerNorm？" [level=2] [ref=e263]
          - paragraph [ref=e264]: 因为句子长短、batch 大小和生成阶段都在变化，而每个 Token 自己的特征维度是稳定的。
        - generic [ref=e265]:
          - article [ref=e266]:
            - heading "校准依据：当前最新的残差累积状态" [level=3] [ref=e267]
            - paragraph [ref=e268]: 你的理解可以写成一条不断循环的流水线：每次子层都读取当前最新状态，先校准，再计算本轮变更量，最后把变更加回残差主干。
            - generic [ref=e269]:
              - generic [ref=e270]:
                - generic [ref=e271]: "1"
                - generic [ref=e272]: 当前状态 x
                - text: 它已经包含前面多层、Attention 和 FFN 累积下来的历史变更。
              - generic [ref=e273]:
                - generic [ref=e274]: "2"
                - generic [ref=e275]: LN(x) → 子层 → Δx
                - text: 基于最新状态制作一个校准后的“工作副本”，用来计算本轮变更。
              - generic [ref=e276]:
                - generic [ref=e277]: "3"
                - generic [ref=e278]: x + Δx → 新状态 x′
                - text: 把本轮变更加回残差主干；下一次 LayerNorm 就以 x′ 为依据。
            - generic [ref=e279]: x → LN(x) → Attention → Δx₁ → x₁ = x + Δx₁ → LN(x₁) → FFN → Δx₂ → x₂ = x₁ + Δx₂
            - generic [ref=e280]:
              - strong [ref=e281]: Pre-LN 的关键细节：
              - text: LayerNorm 不直接改写残差主干 x，而是把 LN(x) 交给 Attention 或 FFN。残差主干继续保存原状态与历次变更；下一个 LayerNorm 再读取更新后的主干。
          - article [ref=e282]:
            - heading "不依赖旁边坐着谁" [level=3] [ref=e283]
            - paragraph [ref=e284]: 一个 batch 放 1 句话还是 128 句话，都不会改变当前 Token 的归一化方式，分布式训练和梯度累积也更自然。
          - article [ref=e285]:
            - heading "适合变长序列" [level=3] [ref=e286]
            - paragraph [ref=e287]: 句子有长有短，还会出现 padding。LayerNorm 不需要把不同位置、不同句子的 Token 混在一起统计。
          - article [ref=e288]:
            - heading "适合逐 Token 生成" [level=3] [ref=e289]
            - paragraph [ref=e290]: 大模型常常一次只生成一个新 Token，batch 和上下文长度不断变化。LayerNorm 仍然可以独立、稳定地工作。
          - article [ref=e291]:
            - heading "训练与推理规则一致" [level=3] [ref=e292]
            - paragraph [ref=e293]: LayerNorm 两个阶段都根据当前 Token 自己计算，不需要维护一套训练期的滑动均值和方差。
          - article [ref=e294]:
            - heading "它稳定的是数值平台，不是判断语义对错" [level=3] [ref=e295]
            - paragraph [ref=e296]: LayerNorm 能避免某层输入忽大忽小，让 Attention 和 FFN 更容易训练；但它不会判断“这个 Token 理解得对不对”。
            - generic [ref=e297]:
              - strong [ref=e298]: 工厂类比：
              - text: 它像每道工序前校准尺子和亮度计。工具刻度稳定了，工人更容易施工，但校准仪器并不替工人决定产品应该做成什么。
