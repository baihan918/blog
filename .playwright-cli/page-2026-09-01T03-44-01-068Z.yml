            - code [ref=e228]: "class ConversationState(TypedDict): messages: list # 最近活跃消息 rolling_summary: str # 当前唯一总摘要 summary_until_message_id: str def compact(state, store, message_db): archived, recent = split_at_semantic_boundary( state[\"messages\"], keep_recent_tokens=6000 ) # 1. 原始消息已由 message_db 完整持久化 chunk = summarize_chunk(archived) # 2. 分段摘要永久保存并建立检索索引 store.put( namespace=(user_id, \"conversation_chunks\"), value={ \"text\": chunk, \"start_message_id\": archived[0].id, \"end_message_id\": archived[-1].id, \"source_message_ids\": [m.id for m in archived], }, ) # 3. 用旧总摘要 + 新分段摘要，得到最新总摘要 new_summary = update_rolling_summary( state[\"rolling_summary\"], chunk ) # 4. 上述写入成功后，旧消息才退出活跃 State return { \"rolling_summary\": new_summary, \"messages\": remove_archived(archived), \"summary_until_message_id\": archived[-1].id, }"
