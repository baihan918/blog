                - listitem [ref=e64]: 旧摘要 + 新归档段 → 新摘要
                - listitem [ref=e65]: 通常当前 State 只保留最新版
            - generic [ref=e66]:
              - generic [ref=e67]: 🗂️
              - heading "分段摘要" [level=3] [ref=e68]
              - paragraph [ref=e69]: 像一本书的章节目录。每段独立保存，需要回忆时按语义搜索命中。
              - list [ref=e70]:
