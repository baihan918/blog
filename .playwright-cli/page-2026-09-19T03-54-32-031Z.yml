          - strong [ref=e950]: Capability Planner 屏蔽“具体有哪些工具”，Tool Router 屏蔽“当前应该选哪个工具”，Tool Runtime 屏蔽“这个工具到底通过 MCP、Function、RAG、Code 还是 Browser 实现”。
