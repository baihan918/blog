    - article [ref=e58]:
      - heading "SECTION 01 1. 核心结论" [level=2] [ref=e59]
      - paragraph [ref=e60]:
        - text: 提升 Agent Function Calling 灵活性的关键，不是简单给模型提供更多 Function，而是增加一层
        - strong [ref=e61]: Capability（能力）抽象
        - text: ：
      - blockquote [ref=e62]:
        - paragraph [ref=e63]:
          - strong [ref=e64]: Task Understanding → Capability Planning → Tool Router → Tool Registry → Function Calling → Tool Policy → Tool Runtime → Observe → Re-plan
      - paragraph [ref=e65]: 其中：
      - list [ref=e66]:
        - listitem [ref=e67]:
          - strong [ref=e68]: Capability Planning 不直接感知所有具体 Function。
        - listitem [ref=e69]: 它只需要知道系统可以提供哪些“能力”。
        - listitem [ref=e70]: 具体 Function 由 Tool Router / Tool Registry 根据 Capability 动态解析和加载。
        - listitem [ref=e71]: Capability 相对稳定，底层 Tool 可以持续新增、替换和演进。
      - paragraph [ref=e72]: 这可以避免 Tool 数量越来越多后，把几十甚至上百个 Function Schema 一次性塞给 LLM。
      - separator [ref=e73]
